[workspace]
resolver = "2"
members = [
  "contracts/*",
]

[workspace.package]
# Keep in sync with VERSION / git tag v0.2.0 (release.yml validates; no Harbor image)
version = "0.2.0"

[workspace.dependencies]
soroban-sdk = "28"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://developers.stellar.org/docs/build/smart-contracts/example-contracts/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
